name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin secret KEYSTORE_BASE64: el APK sale sin firmar (no instalable). Ver README, sección Firma."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests + APK release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain testDebugUnitTest assembleRelease 2>&1 | tee build.log; then
            # Errores visibles como annotations (los logs completos requieren login)
            grep -E "^e: |error:|What went wrong|FAILED|Exception|> " build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          fi

      - name: Nombrar APK con la versión
        run: |
          VERSION=$(sed -nE 's/.*versionName = "(.*)".*/\1/p' app/build.gradle.kts)
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "out/workout-tracker-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
